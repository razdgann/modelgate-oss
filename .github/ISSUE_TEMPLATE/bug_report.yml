name: Bug report
description: Report a reproducible ModelGate OSS problem
body:
  - type: textarea
    attributes: {label: What happened?, description: Include expected and actual behavior.}
    validations: {required: true}
  - type: textarea
    attributes: {label: Reproduction, description: Provide minimal steps with secrets removed.}
    validations: {required: true}
  - type: input
    attributes: {label: Version and environment}
    validations: {required: true}
  - type: checkboxes
    attributes:
      label: Safety
      options:
        - label: I removed API keys, prompt content, and personal information.
          required: true
