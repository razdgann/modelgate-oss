services:
  modelgate:
    build: .
    ports:
      - "8080:8080"
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      MODELGATE_HOST: 0.0.0.0
      MODELGATE_DATABASE_URL: /app/data/modelgate.db
      MODELGATE_CAPTURE_CONTENT: ${MODELGATE_CAPTURE_CONTENT:-false}
    volumes:
      - modelgate-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
volumes:
  modelgate-data:
